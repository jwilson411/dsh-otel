# The dsh-otel bundle patch.
#
# `dsh plugin --profile <name> add …` installs this package into the profile,
# sees the `dsh.bundle.patch` field in its package.json, and appends the
# package to the profile manifest's ordered `dsh.profile.bundles` list. This
# file is then composed as one layer over the bundles below it (dsh-base and
# the mode bundle) and under the profile's own cordis.patch.yml.
#
# One insert, one row: the exporter plugin. A later layer — the profile's
# cordis.patch.yml or a `--patch` overlay — addresses the row by its `id` to
# turn the exporter on and point it somewhere. Note that an id-targeted patch
# replaces the row's whole `config` rather than merging into it, so an override
# must restate every field it means to keep.
#
# The row carries no config here on purpose: with no `exporter` the plugin
# registers its tool and builds spans but sends nothing anywhere. Telemetry
# leaving a machine should be a thing someone turned on.
#
# config:
#   exporter    off | stdout | otlp-http (default: $DSH_OTEL_EXPORTER, else off)
#   endpoint    OTLP/HTTP traces endpoint, used only when exporter is otlp-http
#               (default: $DSH_OTEL_ENDPOINT, else
#               http://127.0.0.1:4318/v1/traces)
#   sessionLog  session log the tool exports when the call names no path
#               (default: $DSH_OTEL_SESSION_LOG, else unset — a call with
#               neither fails loudly rather than exporting an empty trace)
#   sessionId   session id the trace is attributed to, and the trace id is
#               derived from (default: $DSH_OTEL_SESSION_ID, else the id the
#               log's own header names, else "unknown")

- insert:
    - id: otel
      name: dsh-otel
